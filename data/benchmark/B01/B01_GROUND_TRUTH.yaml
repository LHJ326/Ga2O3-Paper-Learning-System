reading_order_notes:
  - page: 1
    anchors:
      - "Title and abstract precede Section 1 Introduction."
      - "Author affiliations and correspondence blocks are front matter, not Introduction body text."

  - page: 2
    anchors:
      - "Introduction continuation precedes Section 2 Results and Discussion."
      - "Equations/reactions (1), (2), and (3) occur immediately after the opening paragraph of Section 2."

  - page: 3
    anchors:
      - "Figure 1 and its caption occur before the body text continuing the Figure 1 discussion."
      - "Figure 1 caption must remain associated with Figure 1 rather than adjacent body paragraphs."

  - page: 4
    anchors:
      - "Figure 2 and its caption occur before the main body discussion."
      - "Equation (4) is embedded in the Results and Discussion body after discussion of Figure 2a and Figure 2b."

  - page: 5
    anchors:
      - "Figure 3 and its caption occur before the body text discussing detector performance."

  - page: 6
    anchors:
      - "Page contains continuation of Figure 3 performance discussion."
      - "Equations (5), (6), and (7) appear in sequence within the body."
      - "Discussion transitions from Figure 3 to Figure 4 near the end of the page."

  - page: 7
    anchors:
      - "Figure 4 and its caption occur before the body text continuing the mechanism discussion."

  - page: 8
    anchors:
      - "Figure 5 and its caption occur before its body discussion."
      - "Section 3 Conclusion begins after the Figure 5 discussion on the same page."

  - page: 9
    anchors:
      - "Section 3 Conclusion continues at the top of the page."
      - "Section 4 Experimental Section follows the conclusion."
      - "Experimental subsections are followed by Supporting Information, Acknowledgements, Conflict of Interest, Data Availability Statement, Keywords, and reference entries."

  - page: 10
    anchors:
      - "References continue through the page after the repeated publisher header."