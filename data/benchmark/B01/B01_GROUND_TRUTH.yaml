figures:
  - number: 1
    page: 3
    caption: >-
      a) Schematic diagram of Mg-doped α-Ga2O3 nanorods.
      b,c) SEM images of α-Ga2O3 and Mg-Ga2O3 nanorods, respectively.
      d) TEM image of an individual Mg-Ga2O3 nanorod.
      e) HR-TEM image of the selected region.
      f) Inverse FFT image of the specific region.
      g) EDS images of an individual nanorod.
      h) XRD pattern of α-Ga2O3 and Mg-Ga2O3.
      i) XPS elemental peak analysis.
      (i-1) The XPS peak fitting of Ga 2p.
      (i-2) The XPS peak fitting of O 1s.
      (i-3) Peak fitting plots of elemental Mg.

  - number: 2
    page: 4
    caption: >-
      a) The XPS peak fitting of Ga 3d core-level spectrum.
      b) The PL spectra of α-Ga2O3 and Mg-Ga2O3.
      c) The conventional structure of α-Ga2O3 and the different types of defects.
      d) The formation energies of defects in Mg-doped α-Ga2O3.
      The dashed line denotes the calculated bandgap of α-Ga2O3.

  - number: 3
    page: 5
    caption: >-
      a) Spectral response of α-Ga2O3 and Mg-Ga2O3.
      b) Comparison of I-T curves for two SBPDs at 0 V bias, 254 nm illumination,
      and varying light intensities.
      c) Time response comparison of the two SBPDs.
      d) The responsivity of the two SBPDs as a function of light power density.
      e) Detectivity comparison of the two SBPDs.
      f) Photo-dark current ratio under varying light power densities.
      g) Stability test curve for the Mg-Ga2O3 SBPD.
      h) Responsivity and time response of Mg-Ga2O3 SBPD in comparison with
      previously reported works.

  - number: 4
    page: 7
    caption: >-
      a) The schematic diagram of the operating principle of the PEC device.
      b) The interface of the PEC photodetector fabricated in this work.
      c) UV-vis absorption spectra of α-Ga2O3 and Mg-Ga2O3 SBPDs.
      d) Electrochemical impedance spectra (EIS) for α-Ga2O3 and Mg-Ga2O3 SBPDs.
      e) The equivalent current and corresponding magnified plots.
      f) The mechanism diagram of α-Ga2O3 and Mg-Ga2O3 SBPDs.

  - number: 5
    page: 8
    caption: >-
      a) The preparation process of the 5 × 5 matrix array.
      b) The underwater imaging system.
      c) Average photocurrent under illumination at 500 μW cm−2 (254 nm)
      and dark current curve for the Mg-Ga2O3 5 × 5 array.
      d,e) 2D thermal images of “U” and “Z”, respectively.

