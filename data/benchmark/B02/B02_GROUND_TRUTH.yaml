equations:
  - number: 1
    page: 2
    transcription: H = -Σ J_ij σ_i σ_j - Σ h_i σ_i
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 2
    page: 2
    transcription: F_i = -(Σ_j J_ij σ_j + h_i)
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 3
    page: 2
    transcription: >-
      σ_(i+1) = {-1 if H_i > 0; +1 if H_i < 0; +1/-1 if H_i = 0}
    transcription_type: manual_transcription_normalized
    notes:
      - The source PDF uses H_i in all three conditions; do not normalize it to F_i.
    needs_manual_confirmation: false
  - number: 4
    page: 3
    transcription: P(ΔE/T) = 1 / (1 + exp(ΔE/T))
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 5
    page: 3
    transcription: P_(+1)(F_i/T) = 1 / (1 + exp(-2F_i/T))
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 6
    page: 3
    transcription: >-
      J_ij = [1 / dist_pos(i,j)] × exp[-dist_pixel(i,j)^2 / (2σ^2)]
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 7
    page: 3
    transcription: h_i = -P(i, θ_fog) + P(i, θ_bkg)
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 8
    page: 3
    transcription: >-
      P(i, θ_x) = [1 / (σ sqrt(2π))] × exp[-(i-μ)^2 / (2σ^2)]
    transcription_type: manual_transcription_normalized
    needs_manual_confirmation: false
  - number: 9
    page: 4
    transcription: >-
      P(i, θ_x) = [1 / ((sqrt(2π))^3 σ1 σ2 σ3)] ×
      exp[-((i-μ1)^2/(4σ1^2) + (i-μ2)^2/(4σ2^2) +
      (i-μ3)^2/(4σ3^2))]
    transcription_type: manual_transcription_normalized
    notes:
      - Manual review confirmed denominator exponent, grouping, and all three 4σ_k^2 terms against the source PDF.
    needs_manual_confirmation: false

