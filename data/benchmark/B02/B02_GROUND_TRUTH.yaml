reading_order_notes:
  - page: 1
    notes:
      - Title, authors, abstract, and Index Terms precede Section I.
      - Figure 1 occupies the upper right column while Introduction flows across columns.
  - page: 8
    notes:
      - Section III.G continues in the left column while Figures 13 and 14 occupy the right upper area.
      - Section IV.A begins in the lower left; Table I appears in the right column before Section IV.B.
      - Manual annotation must preserve logical column order rather than pure vertical coordinates.
  - page: 11
    notes:
      - Table II spans the full page width at the top.
      - Section IV.E continues below the table and transitions to Section V Conclusion.
      - Conclusion text continues into the right column before References.
  - page: 12
    notes:
      - References continue before author biographies; biographies are back matter.

known_layout_features:
  - IEEE two-column body layout on US Letter pages
  - Full-width and single-column Figures
  - Full-width Table II with multi-line cells and footnote markers
  - Single-column Table I embedded beside body text
  - Display Equations with right-aligned numbers
  - Repeated alternating running headers and page numbers
  - Repeated authorized licensed use footer notice
  - References and author biographies in two columns

annotation_todos:
  - Manually transcribe and verify every Figure caption from the original PDF.
  - Manually transcribe and verify Equations (1)-(9), including symbols and subscripts.
  - Verify every Table I value and pass result.
  - Transcribe every Table II cell, unit, normalized/bracketed value, and footnote.
  - Review page-level two-column reading order and add anchors for all ambiguous regions.
