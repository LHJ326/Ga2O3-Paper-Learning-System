    quote: 'To evaluate the performance of our FG memory device for in-memory computing,
      a deep learning model was constructed through the “DNN+NeuroSim” integrated
      framework. “DNN+NeuroSim” is a platform that can simulate the inference or on-chip
      training performance of deep neural networks on hardware accelerators based
      on near-memory computing or in-memory computing architectures.<sup>[77,78]</sup>
      As demonstrated in **Figure 6**a, a VGG-8 network is employed for the purpose
      of object recognition and classification within the image dataset derived from
      CIFAR-10. For image recognition and classification, the workflow is divided
      into two phases: image input and image recognition and classification. During
      the input phase, the CIFAR-10 dataset images are decomposed into RGB threechannel
      components as input data for neural network classification, rather than directly
      feeding raw image information into the device. Subsequently, during the image
      recognition phase, hierarchical feature extraction is accomplished through convolutional
      operations, followed by categorical mapping via fully connected (FC) layers
      for final decision-making. The device serves as a constituent component of the
      neural network to perform neuromorphic computing functions, specifically the
      storage and updating of synaptic weights. DUV light is employed for synaptic
      weight update. The input and Layer 1 to Layer 5are convolutional layers, FC1,
      FC2, and the output layer are fully connected layers. The'
  - evidence_id: E00076
    page: 10
    element_id: P001-text-0112
    element_type: TextBlock
    source_reference: '{"figure_references": [], "mineru_locator": null, "page": 10,
