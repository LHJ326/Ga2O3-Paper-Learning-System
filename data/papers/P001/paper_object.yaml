    quote: The schematic energy-band diagrams of electrical erasing and DUV light
      programming are visualized in Figure 4d. Upon application of an electrical pulse
      with a voltage of −30 V for 0.01 s, electrons initially tunnel through 𝛽-Ga<sub>2</sub>O<sub>3</sub>
      and migrate to the MoS<sub>2</sub> channel, completing the erasing operation.
      Subsequently, following the removal of the gate voltage, a significant accumulation
      of holes occurs in the graphene, which the MoS<sub>2</sub> channel interprets
      as a positive gate voltage, thereby maintaining an on-state. Subsequently, DUV
      light (254 nm) with pulse widths of 1 s is used for programming, which could
      excite electrons from the valence bands of both 𝛽-Ga<sub>2</sub>O<sub>3</sub>
      and MoS<sub>2</sub>, leading to the generation of electron-hole pairs. However,
      it is noted that only the carriers originating from 𝛽-Ga<sub>2</sub>O<sub>3</sub>
      are capable of transiting into either channel or FG. Within the graphene FG,
      the electrons will be neutralized with holes, effectively reducing the gate
      voltage, whereas in the MoS<sub>2</sub> channel, the holes will recombine with
      the electrons, reducing the lifetime of the majority carriers. Consequently,
      the FG memory achieves programming operation through the 254 nm light pulse,
      whereas carriers originating from MoS<sub>2</sub> encounter significant challenges
      in penetrating the dielectric layer. The comparative influence of optical depression
      pulses with pulse widths of 2 and 0.5 s on the output current is illustrated
      in Figure S11 (Supporting Information). The degree of programming is indicated
      to increase with the duration of light exposure. In Figure S12 (Supporting Information),
      additional samples with the different thickness of 𝛽-Ga<sub>2</sub>O<sub>3</sub>
      layer exhibited excellently programmed ability under the pulse light of 254
      nm, thereby providing further corroboration of the photosensitive mechanism
      to the 𝛽-Ga<sub>2</sub>O<sub>3</sub> dielectric layer.<sup>[41,72]</sup> And
      it can be known
