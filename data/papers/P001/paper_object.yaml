      quote: Furthermore, the schematic energy-band diagrams of initial electrical
        erasing are illustrated in Figure 4b, providing a detailed visual representation
        of the device’s operation and energy states. The application of an initial
        erasing pulse at −30 V for 0.01 s facilitates the transfer of electrons from
        graphene to the MoS<sub>2</sub> channel, preventing their subsequent tunneling
        back and thereby generating an internal electric field between the MoS<sub>2</sub>
        channel and the graphene floating gate layer. As illustrated in Figure S9
        (Supporting Information), the photogenerated electrons cannot transit into
        the floating gate due to the absence of an internal electric field, hence
        the programming operation cannot be realized solely by applying 254 nm light
        pulses. Additionally, Figure 4e and Figure S10 (Supporting Information) demonstrate
        the programming operation using 1 s pulses of 405, 635, and 520 nm respectively.
        And it reveals that the photosensitive dielectric layer of 𝛽-Ga<sub>2</sub>O<sub>3</sub>
        fundamentally limits electron tunneling under visible light illumination,
        which will not be affected by the disturbance of visible light. The schematic
        energy-band diagrams of electrical erasing and 405 nm light programming are
        illustrated in Figure 4c. When the visible light pulse is applied, only the
        MoS<sub>2</sub> channel excites electrons from the valence band, and these
        photogenerated electrons cannot tunnel through 𝛽-Ga<sub>2</sub>O<sub>3</sub>,
        leading to a noticeable increase in output current instead of a decrease during
        programming. In Figure 4f, the device is successfully programmed by 254 nm/1
        s light pulse, with reading states measured at V<sub>bg</sub> = 0V and V<sub>ds</sub>
        = 1 V. The capability for multilevel storage within the FG memory is demonstrated
        by augmenting the quantity of light pulses.
