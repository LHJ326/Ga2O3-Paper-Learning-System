        favorable position compared to previous MoS<sub>2</sub>-based FET studies.<sup>[62,63]</sup>
        In Figure S2c (Supporting Information), the output curves (I<sub>ds</sub>–V<sub>ds</sub>)
        suggest the ohmic contacts between the MoS<sub>2</sub> channel and electrodes,
        and I<sub>ds</sub> exhibit a sharp increase with the positive shift of the
        V<sub>cg</sub>. Particularly, the single 𝛽-Ga<sub>2</sub>O<sub>3</sub> device
