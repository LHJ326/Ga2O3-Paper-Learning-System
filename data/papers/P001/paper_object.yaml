      quote: is −0.55 V when V<sub>ds</sub> = 1 V (Figure S2b, Supporting Information).
        Furthermore, the device demonstrates a high on/off ratio of 5 × 10<sup>6</sup>
        and electron mobility of 13.585 cm<sup>2</sup> V<sup>−1</sup> s<sup>−1</sup>
