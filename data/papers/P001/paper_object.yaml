    quote: 'Device Fabrication: The MLG, MoS<sub>2</sub> nanosheets were obtained
      by mechanical exfoliation (3 M Scotch tape) from the bulk (from Shanghai On-Way
      Technology Co., Ltd.). The MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory was fabricated
