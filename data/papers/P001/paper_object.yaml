    quote: Herein, a novel energy-efficient DUV light programming FG memory based
      on ultrathin MoS2/𝛽-Ga2O<sub>3</sub>/Multilayer graphene (MLG) was fabricated.
      Due to the unique optoelectronic characteristics and high dielectric constant
      of 𝛽-Ga<sub>2</sub>O<sub>3</sub>, our FG memories with robust anti-interference
      capabilities could achieve multilevel storage under DUV light only with a low
      power of 254.4 pJ (254 nm, 0 V). And due to the large single photon energy at
      the short wavelength, the photon number (3.25 × 10<sup>8</sup>) used per programming
      operation is much smaller than that of most present works. In addition, the
      device also demonstrates remarkable storage performance including a substantial
      current switching ratio exceeding 10<sup>6</sup>, a significant storage window
      ratio of 78.44%, exceptional retention surpassing 10<sup>3</sup> s, and endurance
      exceeding 1000 programming/erasing cycles under a low programming/erasing (P/E)
      voltage of ±40 V. Ultimately, by mapping the LTP/LTD currents under photoelectric
      hybrid modulation into synaptic weights, a VGG-8 neural network model was constructed
      utilizing MoS<sub>2</sub>/𝛽- Ga<sub>2</sub>O<sub>3</sub>/MLG FG memory devices,
      which could achieve an accuracy of 91.07% for the image recognition in the CIFAR-10
      dataset. In summary, the innovative design provided new insights for the van
      der Waals heterostructure optical memory devices based on the Ga<sub>2</sub>O<sub>3</sub>
      photosensitive dielectric, which in turn provides a new building block for constructing
      energyefficient artificial visual neuromorphic systems with high performance.
