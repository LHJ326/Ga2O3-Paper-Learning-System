    quote: is −0.55 V when V<sub>ds</sub> = 1 V (Figure S2b, Supporting Information).
      Furthermore, the device demonstrates a high on/off ratio of 5 × 10<sup>6</sup>
      and electron mobility of 13.585 cm<sup>2</sup> V<sup>−1</sup> s<sup>−1</sup>
      (Figure S3, Supporting Information). These properties put the device in a favorable
      position compared to previous MoS<sub>2</sub>-based FET studies.<sup>[62,63]</sup>
      In Figure S2c (Supporting Information), the output curves (I<sub>ds</sub>–V<sub>ds</sub>)
      suggest the ohmic contacts between the MoS<sub>2</sub> channel and electrodes,
      and I<sub>ds</sub> exhibit a sharp increase with the positive shift of the V<sub>cg</sub>.
      Particularly, the single 𝛽-Ga<sub>2</sub>O<sub>3</sub> device exhibits a notably
      low conductivity, with a dark current in the range of 10−1<sup>1</sup>–10−1<sup>2</sup>
      A, indicating its superior insulating capabilities in the absence of ambient
      light (Figure S2f, Supporting Information). Above all, these findings highlight
      the potential of high-𝜅 𝛽-Ga<sub>2</sub>O<sub>3</sub> as a typical dielectric
      layer, and its dielectric properties offer a wide range of application prospects
      in the field of material science and device engineering.
