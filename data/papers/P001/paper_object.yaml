      and the graphene floating gate layer. As illustrated in Figure S9 (Supporting
      Information), the photogenerated electrons cannot transit into the floating
      gate due to the absence of an internal electric field, hence the programming
      operation cannot be realized solely by applying 254 nm light pulses. Additionally,
      Figure 4e and Figure S10 (Supporting Information) demonstrate the programming
      operation using 1 s pulses of 405, 635, and 520 nm respectively. And it reveals
      that the photosensitive dielectric layer of 𝛽-Ga<sub>2</sub>O<sub>3</sub> fundamentally
      limits electron tunneling under visible light illumination, which will not be
      affected by the disturbance of visible light. The schematic energy-band diagrams
      of electrical erasing and 405 nm light programming are illustrated in Figure
