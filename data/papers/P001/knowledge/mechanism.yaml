  quote: processes are illustrated in Figure 3j. Initially, when a +40 V gate voltage
    is applied, electrons will tunnel through 𝛽-Ga<sub>2</sub>O<sub>3</sub> and transfer
    to the graphene FG. Subsequently, when the gate voltage is eliminated to read
    the state-0 current, the substantial electron accumulation in the graphene FG
    is interpreted by the MoS<sub>2</sub> channel as a negative gate voltage, consequently
    driving the MoS<sub>2</sub> channel into off-state. What’s more, when a −40 V
    gate voltage is used to erase, the electrons in graphene will be transferred to
    the MoS<sub>2</sub> channel, thereby forcing the MoS<sub>2</sub> channel into
    an on-state. Thus, the MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory is capable of realizing
    two-level non-volatile storage by electrostatic control.
