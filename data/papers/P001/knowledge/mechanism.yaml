  - value: The physical mechanism of the optical FG memory includes electrical erasing,
      optical programming operations under 405 nm illumination at 0 V, and DUV light
      programming operations under 254 nm illumination at 0 V; initial erasing by
      a −30 V/0.01 s electrical pulse and optical programming by a 405 nm/1 s light
      pulse; initial erasing by a −30 V/0.01 s electrical pulse and DUV light programming
      by a 254 nm/1 s optical pulse.
    evidence_id: E00040
    page: 5
    source_type: TextBlock
    confidence: 0.9
    review_status: unreviewed
  - value: Initially, when a +40 V gate voltage is applied, electrons will tunnel
      through β-Ga2O3 and transfer to the graphene FG. Subsequently, when the gate
      voltage is eliminated to read the state-0 current, the substantial electron
      accumulation in the graphene FG is interpreted by the MoS2 channel as a negative
      gate voltage, consequently driving the MoS2 channel into off-state. What’s more,
      when a −40 V gate voltage is used to erase, the electrons in graphene will be
      transferred to the MoS2 channel, thereby forcing the MoS2 channel into an on-state.
      Thus, the MoS2/β-Ga2O3/MLG FG memory is capable of realizing two-level non-volatile
      storage by electrostatic control.
    evidence_id: E00048
    page: 6
    source_type: TextBlock
    confidence: 0.95
    review_status: unreviewed
  - value: In dark conditions, the β-Ga2O3 functions as a high-κ dielectric layer
      with minimal leakage current, allowing for precise regulation of the channel’s
      carrier density and surface potential through the application of Vcg. The MoS2
      channel uniquely generates a substantial quantity of photogenerated carriers
      under 405 nm, however, the Igs remain unaffected as these carriers are incapable
      of tunneling through the β-Ga2O3 dielectric layer. Conversely, upon exposure
      to 254 nm light, the wide-bandgap β-Ga2O3 exhibits a significant response to
      UV light under 254 nm illumination, which results in a significant enhancement
      of photogenerated carriers. At the control of Vcg = −5 V, the photogenerated
      electrons within the β-Ga2O3 layer are transferred to the conduction band of
      MoS2, leading to a marked response in Igs. Consequently, the unique photosensitive
      characteristics of the high-κ dielectric β-Ga2O3 introduce a novel optoelectronic
      mechanism within FG memory devices.
    evidence_id: E00049
    page: 6
    source_type: TextBlock
    confidence: 0.95
    review_status: unreviewed
  - value: The application of an initial erasing pulse at −30 V for 0.01 s facilitates
      the transfer of electrons from graphene to the MoS2 channel, preventing their
      subsequent tunneling back and thereby generating an internal electric field
      between the MoS2 channel and the graphene floating gate layer. As illustrated
      in Figure S9 (Supporting Information), the photogenerated electrons cannot transit
      into the floating gate due to the absence of an internal electric field, hence
      the programming operation cannot be realized solely by applying 254 nm light
      pulses. When the visible light pulse is applied, only the MoS2 channel excites
      electrons from the valence band, and these photogenerated electrons cannot tunnel
      through β-Ga2O3, leading to a noticeable increase in output current instead
      of a decrease during programming. In Figure 4f, the device is successfully programmed
      by 254 nm/1 s light pulse, with reading states measured at Vbg = 0V and Vds
      = 1 V. The capability for multilevel storage within the FG memory is demonstrated
      by augmenting the quantity of light pulses.
    evidence_id: E00053
    page: 7
    source_type: TextBlock
    confidence: 0.95
    review_status: unreviewed
  - value: Upon application of an electrical pulse with a voltage of −30 V for 0.01
      s, electrons initially tunnel through β-Ga2O3 and migrate to the MoS2 channel,
      completing the erasing operation. Subsequently, following the removal of the
      gate voltage, a significant accumulation of holes occurs in the graphene, which
      the MoS2 channel interprets as a positive gate voltage, thereby maintaining
      an on-state. Subsequently, DUV light (254 nm) with pulse widths of 1 s is used
      for programming, which could excite electrons from the valence bands of both
      β-Ga2O3 and MoS2, leading to the generation of electron-hole pairs. However,
      only the carriers originating from β-Ga2O3 are capable of transiting into either
      channel or FG. Within the graphene FG, the electrons will be neutralized with
      holes, effectively reducing the gate voltage, whereas in the MoS2 channel, the
      holes will recombine with the electrons, reducing the lifetime of the majority
      carriers. Consequently, the FG memory achieves programming operation through
      the 254 nm light pulse, whereas carriers originating from MoS2 encounter significant
      challenges in penetrating the dielectric layer.
    evidence_id: E00054
    page: 7
    source_type: TextBlock
