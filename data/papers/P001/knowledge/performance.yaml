  quote: Apart from its competitive performance of electrical memory devices, 𝛽-Ga<sub>2</sub>O<sub>3</sub>
    can also function as a photosensitive high-𝜅 dielectric layer, due to the combination
    of high dielectric constant and excellent optoelectronic properties. The photoresponse
    characteristics of a MoS<sub>2</sub> FET and a MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG
    memory device were investigated under the dual influence of electrical pulsing
    and photonic irradiation, with 𝛽-Ga<sub>2</sub>O<sub>3</sub> serving as the photosensitive
    high-𝜅 dielectric layer. The schematic illustration of MoS<sub>2</sub> FET with
    𝛽-Ga<sub>2</sub>O<sub>3</sub> is shown in Figure S8a (Supporting Information).
    And time-resolved I<sub>gs</sub> curves of the MoS<sub>2</sub> FET at V<sub>b</sub>
    =−5 V under 405 nm are shown in Figure S8c (Supporting Information). Notably,
    the I<sub>gs</sub> remains at a minimal level of ∼10−14 A under visible light,
    which underscores the significant applicability of 𝛽-Ga<sub>2</sub>O<sub>3</sub>
    for high-𝜅 dielectric applications. Additionally, as depicted in Figure S8d, the
    obvious photoresponse of I<sub>gs</sub> to 254 nm light on/off switching cycles
    underscores the inherent UV-sensitive characteristic of the 𝛽- Ga<sub>2</sub>O<sub>3</sub>
    at V<sub>cg</sub> =−5 V under 254 nm, indicating its significant potential as
    an efficient photosensitive dielectric. Furthermore, the schematic energy-band
    diagrams of the optoelectronic behavior are illustrated in Figure S8b. In dark
    conditions, the 𝛽-Ga<sub>2</sub>O<sub>3</sub> functions as a high-𝜅 dielectric
    layer with minimal leakage current, allowing for precise regulation of the channel’s
    carrier density and surface potential through the application of V<sub>cg</sub>.<sup>[69]</sup>
    The MoS<sub>2</sub> channel uniquely generates a substantial quantity of photogenerated
    carriers under 405 nm, however, the I<sub>gs</sub> remain unaffected as these
    carriers are incapable of tunneling through the 𝛽-Ga<sub>2</sub>O<sub>3</sub>
    dielectric layer. Conversely, upon exposure to 254 nm light, the wide-bandgap
    𝛽-Ga<sub>2</sub>O<sub>3</sub> exhibits a significant response to UV light under
    254 nm illumination, which results in a significant enhancement of photogenerated
    carriers. At the control of V<sub>cg</sub> =−5 V, the photogenerated electrons
    within the 𝛽- Ga<sub>2</sub>O<sub>3</sub> layer are transferred to the conduction
    band of MoS<sub>2</sub>, leading to a marked response in I<sub>gs</sub>. Consequently,
    the unique photosensitive characteristics of the high-𝜅 dielectric 𝛽-Ga<sub>2</sub>O<sub>3</sub>
    introduce a novel optoelectronic mechanism within FG memory devices.
