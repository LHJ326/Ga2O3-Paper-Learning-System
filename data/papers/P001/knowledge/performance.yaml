  quote: Therefore, the device shows excellent storage performance under electrical
    pulse, including a big current switching ratio of more than 10<sup>6</sup>, large
    storage window ratio of 78.44%, excellent retention surpassing 10<sup>3</sup>
    s, and endurance exceeding 1000 programming/erasing cycles only with a low programming/erasing
    (P/E) voltage of ±40 V in a small equivalent electric field intensity of 7.94
    MV cm−1.[52–56] Furthermore, the device was capable of achieving multilevel storage
    only by controlling the pulse DUV light (254 nm) with a low power of 254.4 pJ
    (0 V). And the number (3.25 × 10<sup>8</sup>) of photons per programming operation
    is much smaller than that of most present works.[32–34,5<sup>3</sup>,5<sup>4</sup>,5<sup>7</sup>,5<sup>8</sup>]
    The distinctive mechanism indicates that our MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory
    device holds great potential for optical memory, benefiting from strong anti-interference
    performance and reduction of dielectric layer losses due to the avoidance of tunneling
    mechanism. Finally, the MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory device also demonstrates
    significant synaptic properties under photoelectric hybrid modulation, including
    synaptic short-term plasticity, pairpulse facilitation (PPF), and synaptic long-term
    plasticity. The VGG-8 model based on MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory device
    achieves 91.07% recognition accuracy on CIFAR-10 dataset images. This work offers
    a new scheme for constructing an ultrathin neuromorphic storage and computing
    integrated system by using a DUV photosensitive dielectric.
