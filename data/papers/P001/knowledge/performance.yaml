  quote: Figure 4. The physical mechanism of the optical FG memory and comparison
    of nonvolatile electrical/optoelectrical 2D FG memory devices. a) Schematic diagram
    of the MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory device under 254 nm light illumination.
    b) Schematic energy-band diagrams of the FG memory device for electrical erasing.
    c) Schematic energy-band diagrams of the FG memory device for optical programming
    operations under 405 nm illumination at 0 V. d) Schematic energy-band diagrams
    of the FG memory device for DUV light programming operations under 254 nm illumination
    at 0 V. e) Initial erasing operation by a −30 V/0.01 s electrical pulse and optical
    programming operation by 405 nm/1 s light pulse. f) Initial erasing operation
    by a −30 V/0.01 s electrical pulse and DUV light programming operation by 254
    nm/1 s optical pulse. g) Comparison of photon number and operating wavelength
    of the MoS2/𝛽-Ga2O<sub>3</sub>/MLG FG memory device and other reported optoelectrical
    FG memory devices. The star shape represents pure light control, while the square
    shape represents simultaneous control of both light and electricity. h) Comparison
    of electrical switching ratio and P/E voltage of the MoS2/𝛽-Ga2O<sub>3</sub>/MLG
    FG memory device and other reported FG memory devices. The star shape represents
    pure light control, the square shape represents simultaneous control of both light
    and electricity, and the triangle shape represents pure electric control.
