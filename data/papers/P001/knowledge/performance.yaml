  quote: The switching ratios at different pulse widths when the P/E voltage is ±40
    V and V<sub>ds</sub> = 1 V are exhibited in Figure 3f. An evident trend of increasing
    difficulty in P/E operations is observed with decreasing pulse widths, Figure
    S5 (Supporting Information) suggests that an ideal P/E operating pulse width of
    0.1 s for the device is optimal, as it allows for a high on/off ratio of 5 × 10<sup>6</sup>
    to be tightly controlled. In addition, Figure 3g illustrates the switching ratios
    at different P/E voltages with the pulse width of 0.1 s and V<sub>ds</sub> = 1
    V. Obviously, when the pulse voltage decreases, the convenience of the P/E operations
    will diminish. Further details, as depicted in Figure S6 (Supporting Information),
    reveal that the optimal P/E operating voltage for the device is ±40 V, as this
    voltage ensures the maintenance of a high on/off ratio of 5 × 10<sup>6</sup>,
    thereby underscoring the device’s operational efficiency and reliability. And
    the retention stability of the programming and erasing states was measured at
    V<sub>bg</sub> = 0 V and V<sub>ds</sub> = 1 V, respectively, after applying ±40
    V/0.1 s electrical pulse (Figure 3h). Throughout an extended retention period
    exceeding 10<sup>3</sup> s, the currents of state-0 and state-1 demonstrated tremendous
    stability. And the anticipated retention currents of the device for over 10 years
    are shown in Figure S7 (Supporting Information). The expected retention time of
    the current ratio between the two states exceeds 10<sup>3</sup>, indicating that
    the FG memory device has excellent retention capability.
