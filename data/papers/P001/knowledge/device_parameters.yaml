  quote: To solve the above problems and explore novel energyefficient 2D FG memory
    with high performance, a novel energyefficient DUV light programming FG memory
    based on ultrathin MoS<sub>2</sub>/𝛽-phase Gallium oxide (𝛽-Ga<sub>2</sub>O<sub>3</sub>)/Multilayer
    graphene (MLG) is proposed based on our previous works.<sup>[36–38]</sup> To depict
    the schematics of the human visual system vividly, the working process including
    information reception and information processing is shown in **Figure 1**a. Unlike
    present FG memory used in neuromorphic systems, ultra-wide bandgap (4.9 eV) 𝛽-Ga<sub>2</sub>O<sub>3</sub>
    with a high dielectric constant (ɛ = 10) and a high breakdown field (8 MV cm−1)[39–42]
    can function as a photosensitive dielectric in our device (Figure 1b), which not
    only could be functioned as an insulating dielectric layer in the dark blocking
    the carriers trapped in the FG but also excite photogenerated carriers under the
    deep-ultraviolet (DUV) radiation.<sup>[43–48]</sup> In addition, because the stratospheric
    ozone layer surrounding the earth absorbs high-energy ultraviolet radiation, our
    optoelectrical memory operating in the DUV solarblind region (220-280 nm) could
    avoid interference from solar radiation.<sup>[49–51]</sup>
