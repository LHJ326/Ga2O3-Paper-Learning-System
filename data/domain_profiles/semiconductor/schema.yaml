  sections:
    material:
      semiconductor:
        label: semiconductor material
        description: Semiconductor materials explicitly identified by the paper.
      crystal_phase:
        label: crystal phase
        description: Explicit phase, polymorph, orientation, or crystallinity.
      doping:
        label: doping
        description: Explicit dopant, concentration, method, and reported role.
