performance:
  schema_version: "1.0"
  domain_id: semiconductor.ga2o3.photodetector.performance
  page_numbering: one_based
  missing_value: null
  observation_contract:
    required_fields: [value, unit, evidence_id, page, source_type]
    numeric_values_require_unit: true
    prohibit_external_knowledge: true
  groups:
    optical_performance:
      detection_wavelength: {label: detection wavelength}
      responsivity: {label: responsivity}
      detectivity: {label: detectivity}
      external_quantum_efficiency: {label: external quantum efficiency}
      spectral_response_range: {label: spectral response range}
    electrical_performance:
      photocurrent: {label: photocurrent}
      dark_current: {label: dark current}
      on_off_ratio: {label: on/off ratio}
      bias_voltage: {label: bias voltage}
    dynamic_performance:
      rise_time: {label: rise time}
      decay_time: {label: decay time}
      response_time: {label: response time}
    stability:
      operation_time: {label: operation time}
      cycle_stability: {label: cycle stability}
      environmental_stability: {label: environmental stability}

mechanism:
  schema_version: "1.0"
  domain_id: semiconductor.ga2o3.photodetector.mechanism
  page_numbering: one_based
  missing_value: null
  observation_contract:
    required_fields: [value, evidence_id, page, source_type, confidence, review_status]
    confidence_range: [0.0, 1.0]
    allowed_review_status: [unreviewed, review_required]
    prohibit_external_knowledge: true
  fields:
    photogeneration: {description: Explicitly stated photocarrier generation process.}
    carrier_transport: {description: Explicit carrier motion, tunneling, trapping, or transfer.}
    recombination: {description: Explicit carrier recombination process.}
    defect_mechanism: {description: Explicit role of defects, vacancies, or traps.}
    interface_effect: {description: Explicit interface-induced electronic or optical effect.}
    band_alignment: {description: Explicit band alignment, offset, or band-diagram interpretation.}
    gain_mechanism: {description: Explicit physical origin of photoconductive or optical gain.}
    device_working_principle: {description: Explicit operating sequence or physical device principle.}

evidence_contract:
  reference_field: evidence_refs
  target: core.evidence_traceability.evidence_index
  page_numbering: one_based
  required_per_evidence_record: [evidence_id, page, element_type, source_reference, quote]
  prohibit_external_knowledge: true
